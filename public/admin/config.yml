# Decap CMS config — Live Web Studios blog
# Folder collection writing markdown into the Astro content collection
# (src/content/blog). Each save commits via Git Gateway -> Netlify rebuilds ->
# Astro statically renders the post as real HTML with meta, canonical, and
# JSON-LD. This replaces the old single-JSON + client-side-render setup, which
# is why posts weren't getting indexed by Google (crawlers saw an empty shell).
# Note: the specs/cms-decap.md "file collections only" rule predates the Astro
# build; no GitHub Action is needed here because Astro IS the build step.
# Decap stays pinned to 3.1.2 in admin/index.html per the spec.

backend:
  name: git-gateway
  branch: main

# Uploads commit under public/ and serve at images/uploads/. public_folder
# stays root-relative here because Decap stores it in frontmatter; the Astro
# templates strip the leading slash and emit relative paths per the LWS rule.
media_folder: "public/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    sort_by: ["date"]
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        picker_utc: true
      - label: "Description"
        name: "description"
        widget: "text"
        required: false
        hint: "1-2 sentences. Shown on blog cards and used as the Google search snippet. Write it like a search result."
      - { label: "Featured Image", name: "image", widget: "image", required: false, hint: "Card thumbnail + top of the post." }
      - label: "Categories"
        name: "categories"
        widget: "select"
        multiple: true
        min: 1
        max: 3
        hint: "Pick one to three. The post appears on every archive you choose, and they are listed on the card and at the foot of the post."
        options:
          - "Web Design"
          - "SEO & Local Search"
          - "AI & Automation"
          - "Hosting & Performance"
          - "WordPress & Migration"
          - "Running a Business Online"
          - "LWS News"
      - label: "Tags"
        name: "tags"
        widget: "list"
        required: false
        default: []
        hint: "Optional, and not shown on the site. Category does the organising; tags are just notes to yourself."
      - { label: "Draft", name: "draft", widget: "boolean", default: false, required: false, hint: "Tick to hide this post from the public blog." }
      - { label: "Body", name: "body", widget: "markdown" }
